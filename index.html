<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Perjalanan Hidup Saya - Yigal Amiel Benggu</title>
  <link href="https://jsdelivr.net" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    body{background:#d7ccc8;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#4e342e}
    .siakad-header{background:linear-gradient(135deg,#5d4037,#4e342e);color:#fff;padding:30px 20px;border-bottom-left-radius:20px;border-bottom-right-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
    .header-logo{width:90px;height:90px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;border:4px solid #ffcc80;box-shadow:0 2px 5px rgba(0,0,0,.2)}
    .header-title{font-size:1.1rem;font-weight:600;letter-spacing:.5px;line-height:1.4}
    .btn-header-action{background:rgba(255,255,255,.1);border:none;color:#fff;padding:12px;border-radius:10px;font-size:.9rem;backdrop-filter:blur(5px);transition:all .2s;width:100%;display:flex;flex-direction:column;align-items:center}
    .btn-header-action:hover{background:rgba(255,255,255,.2);color:#fff}
    .section-title{font-size:1.4rem;font-weight:700;color:#3e2723;margin:25px 0 15px}
    .modul-card{background:#fff;border-radius:15px;padding:25px 20px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s;cursor:pointer;display:block;color:inherit;height:100%;border-bottom:5px solid var(--ac,#8d6e63)}
    .modul-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.15)}
    .modul-icon{font-size:2.5rem;margin-bottom:12px}
    .modul-name{font-size:1.05rem;font-weight:600;color:#4e342e}
    .modul-desc{font-size:.8rem;color:#8d6e63;margin-top:4px}
    .modal-content{border-radius:20px;border:none;background:#fdfbfa}
    .modal-header{background:#5d4037;color:#fff;border-top-left-radius:20px;border-top-right-radius:20px}
    .btn-close-white{filter:invert(1) grayscale(100%) brightness(200%)}
    .foto-profil{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .foto-besar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #8d6e63;box-shadow:0 4px 12px rgba(0,0,0,.2)}
    .card-cover{width:100%;height:120px;display:block;border-radius:10px;margin-bottom:14px}
    .modal-banner{height:130px;position:relative;overflow:hidden}
    .modal-banner svg{position:absolute;inset:0;width:100%;height:100%}
    .list-group-item{background:transparent;color:#4e342e}
    .tag{display:inline-block;background:#efebe9;color:#4e342e;border-radius:20px;padding:4px 12px;margin:3px;font-size:.85rem}
    .nama-besar{font-size:2rem;font-weight:800;color:#fff;letter-spacing:.5px;margin:6px 0 2px;text-shadow:0 2px 8px rgba(0,0,0,.35)}
    .sub-nama{color:#ffcc80;font-weight:600;font-size:.95rem}
    .chip{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;padding:5px 14px;margin:3px;font-size:.8rem}
    .container{max-width:1100px}
    .banner-nama{position:absolute;left:0;right:0;bottom:0;padding:18px 14px 8px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:.8rem;font-weight:600;text-align:center;letter-spacing:.4px}
    .profil-cover{height:120px;background:linear-gradient(135deg,#8d6e63,#3e2723);position:relative}
    .profil-foto-wrap{margin-top:-65px;text-align:center}
    .profil-foto-wrap .foto-besar{width:130px;height:130px;border:5px solid #fff}
    .stat{background:#efebe9;border-radius:12px;padding:10px 4px;text-align:center}
    .stat b{display:block;font-size:1.1rem;color:#5d4037}
    .stat span{font-size:.7rem;color:#8d6e63}
    .info-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #efebe9;font-size:.88rem}
    .info-row i{width:22px;color:#8d6e63;margin-top:3px;text-align:center}
    .info-row small{display:block;color:#8d6e63;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px}
    @media(min-width:768px){.nama-besar{font-size:2.6rem}}
  </style>
  <script>
    const AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://w3.org" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffcc80"/><stop offset="1" stop-color="#8d6e63"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><circle cx="100" cy="78" r="38" fill="#fff3e0"/><path d="M60 74c0-30 20-44 42-44s38 14 38 40c-8-14-22-20-40-20s-30 8-40 24z" fill="#4e342e"/><path d="M28 200c4-46 34-70 72-70s68 24 72 70z" fill="#5d4037"/><path d="M84 134l16 22 16-22z" fill="#fff3e0"/><circle cx="87" cy="80" r="4" fill="#4e342e"/><circle cx="113" cy="80" r="4" fill="#4e342e"/><path d="M88 95q12 10 24 0" stroke="#8d6e63" stroke-width="4" fill="none" stroke-linecap="round"/></svg>');
    function pasangFoto() {
      document.querySelectorAll('img.foto').forEach(i => {
        i.onerror = function() { this.onerror = null; this.src = AVATAR; };
        i.src = 'foto-saya.jpg';
      });
    }
    document.addEventListener('DOMContentLoaded', pasangFoto);
  </script>
</head>
